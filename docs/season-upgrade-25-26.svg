<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Season upgrade 25, 26">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#14302a"/>
    </linearGradient>
    <linearGradient id="pitch" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1fdc72" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#1fdc72" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#1fdc72" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="220" rx="14" fill="url(#bg)"/>
  <!-- a halfway line and centre circle, faint -->
  <rect x="0" y="108" width="1200" height="4" fill="url(#pitch)"/>
  <circle cx="1010" cy="110" r="78" fill="none" stroke="#1fdc72" stroke-opacity="0.12" stroke-width="4"/>
  <text x="60" y="98" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="50" font-weight="900" letter-spacing="3" fill="#ffffff">SEASON UPGRADE</text>
  <text x="62" y="152" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#8fd9b0">FIFA Online 4 cards in FIFA Online 3: 25 LIVE + 26 LIVE</text>
  <!-- season badges: dark plate, green number -->
  <g font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="72" text-anchor="middle">
    <rect x="828" y="58" width="136" height="104" rx="10" fill="#3b4148" stroke="#56606a" stroke-width="3"/>
    <text x="896" y="136" fill="#1fdc72">25</text>
    <rect x="984" y="58" width="136" height="104" rx="10" fill="#3b4148" stroke="#56606a" stroke-width="3"/>
    <text x="1052" y="136" fill="#1fdc72">26</text>
  </g>
</svg>
